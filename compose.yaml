# TrueNAS SCALE 24.10+ Apps > Discover > Install via YAML.
# Adjust the build paths, dataset path, UID/GID and published port for your NAS.
services:
  backend:
    build:
      context:  /mnt/testpool/apps/family-share
      dockerfile: Dockerfile
      target: backend
    user: "3001:3001"
    env_file:
      -  /mnt/testpool/apps/family-share/.env
    environment:
      SHARED_ROOT: /data
      TMPDIR: /data/.family-share-tmp
    volumes:
      - type: bind
        source: /mnt/testpool/apppa
        target: /data
    ports:
      # LAN-only port. Do not forward it on the router.
      - "18080:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  web:
    build:
      context:  /mnt/testpool/apps/family-share
      dockerfile: Dockerfile
      target: web
    network_mode: "service:backend"
    depends_on:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

